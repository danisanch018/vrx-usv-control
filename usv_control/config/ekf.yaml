navsat_transform_node:              
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.2126   
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_utm_transform: true         
    publish_filtered_gps: true
    wait_for_datum: false  
    
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    
    map_frame: world           
    odom_frame: odom                   
    base_link_frame: wamv/wamv/base_link
    world_frame: odom                  

    imu0: /wamv/sensors/imu/imu/data
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
      
    

    odom0: /odometry/gps
    odom0_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
                       

